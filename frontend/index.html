<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Gastos Personales</title>
    <link rel="stylesheet" href="css/estilos.css?v=4" />
    <link rel="stylesheet" href="css/persona-a.css?v=4" />
    <link rel="stylesheet" href="css/persona-b.css?v=4" />
  </head>
  <body>
    <div class="app">
      <!-- ===================== Barra lateral ===================== -->
      <aside class="sidebar">
        <div class="sidebar__marca">
          <span class="sidebar__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C7.5 5.5 5 9.5 5 14a7 7 0 0 0 14 0c0-4.5-2.5-8.5-7-12z" />
            </svg>
          </span>
          <div>
            <div class="sidebar__titulo">Gestor</div>
            <div class="sidebar__subtitulo">Gestor de Gastos</div>
          </div>
        </div>

        <!-- Un solo mecanismo de navegacion (data-pantalla) que maneja
             app.js. Cada persona agrega su boton + su seccion. -->
        <nav class="sidebar__nav">
          <button class="nav-boton nav-boton--activo" data-pantalla="resumen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Resumen
          </button>
          <button class="nav-boton" data-pantalla="movimientos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18l-3-2-2 2-2-2-2 2-2-2-2 2V3a1 1 0 0 1 1-1z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
            Movimientos
          </button>
          <button class="nav-boton" data-pantalla="categorias">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            Categorías
          </button>
          <button class="nav-boton" data-pantalla="metodos-pago">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            Métodos de pago
          </button>
          <button class="nav-boton" data-pantalla="prestamos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
            Préstamos
          </button>
        </nav>
      </aside>

      <!-- ===================== Área principal ===================== -->
      <div class="principal">
        <main class="contenido">
          <!-- Solo la seccion cuyo data-pantalla coincide con el boton
               activo queda visible (mostrarPantalla en app.js). -->

          <!-- Persona A -->
          <!-- La construye resumen.js -->
          <section id="pantalla-resumen" class="pantalla" data-pantalla="resumen"></section>

          <!-- La construye movimientos.js -->
          <section id="pantalla-movimientos" class="pantalla" data-pantalla="movimientos" hidden></section>

          <!-- La construye categorias.js -->
          <section id="pantalla-categorias" class="pantalla" data-pantalla="categorias" hidden></section>

          <!-- Persona B (ya construidas) -->
          <section id="pantalla-metodos-pago" class="pantalla" data-pantalla="metodos-pago" hidden></section>
          <section id="pantalla-prestamos" class="pantalla" data-pantalla="prestamos" hidden></section>
        </main>
      </div>
    </div>

    <!--
      Orden de carga: api.js define api; ui.js los helpers; los archivos
      de pantalla definen sus inicializar*; app.js -al final- los conecta
      con el DOM. Sin framework ni bundler: scripts planos.
    -->
    <script src="js/api.js?v=4"></script>
    <script src="js/ui.js?v=4"></script>
    <script src="js/movimientos.js?v=4"></script>
    <script src="js/resumen.js?v=4"></script>
    <script src="js/categorias.js?v=4"></script>
    <script src="js/metodosPago.js?v=4"></script>
    <script src="js/prestamos.js?v=4"></script>
    <script src="js/app.js?v=4"></script>
  </body>
</html>
