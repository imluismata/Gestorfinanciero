<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Gastos Personales</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/persona-b.css" />
  </head>
  <body>
    <header class="cabecera">
      <h1>Gestor de Gastos</h1>
    </header>

    <!--
      Navegacion entre modulos. Cada persona agrega su seccion y su
      pantalla. Un solo frontend dividido por pantallas, no dos apps.
    -->
    <nav class="nav">
      <!-- Persona A: Movimientos, Categorias, Reportes -->
      <!-- Persona B: Metodos de pago, Prestamos -->
      <button class="nav-boton nav-boton--activo" data-pantalla="metodos-pago">Métodos de pago</button>
      <button class="nav-boton" data-pantalla="prestamos">Préstamos</button>
    </nav>

    <main class="contenido">
      <!-- Cada persona monta aqui el contenedor de su pantalla. Solo la
           que coincide con el boton activo del nav queda visible
           (mostrarPantalla en app.js). -->
      <div id="pantalla">
        <section id="pantalla-metodos-pago" class="pantalla" data-pantalla="metodos-pago"></section>
        <section id="pantalla-prestamos" class="pantalla" data-pantalla="prestamos" hidden></section>
      </div>
    </main>

    <!--
      Orden de carga importa: api.js define api, ui.js define los helpers,
      los archivos de pantalla definen sus funciones de inicializar*, y
      app.js -- al final -- las conecta con el DOM. Sin framework ni
      bundler: scripts planos.
    -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/metodosPago.js"></script>
    <script src="js/prestamos.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
